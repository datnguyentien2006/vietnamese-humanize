- id: VI-HUM-D08
  name: echo-noi-dung
  skill: humanizer-vi
  category: discourse
  finding_type: heuristic
  scope: document
  aggregation: count
  severity: low
  confidence: low
  summary: Cùng một ý được nói lại bằng từ khác ở các đoạn khác nhau, không phải lặp từ mà lặp ý niệm.
  signals:
    regex:
    - '(?!)'
  why_it_matters: >-
    Văn AI tự "vang" (echo) chính nó — lặp lại cùng một ý bằng cách diễn đạt khác
    để trông đầy đủ. Người viết tự nhiên thường mở rộng ý (elaboration) hoặc bỏ
    hẳn, không lặp.
  rewrite_strategy:
  - Gộp các câu cùng ý thành một câu duy nhất.
  - Hoặc mở rộng ý đó bằng chi tiết mới thay vì lặp lại.
  bad_examples:
  - text: >-
      Dự án cần thêm ngân sách để hoàn thành.

      Chúng tôi đang thiếu nguồn lực tài chính cho dự án.

      Vấn đề chính là dự án chưa có đủ tiền.
    reason: Ba câu cùng ý, khác từ ngữ.
  - text: >-
      Đội ngũ cần được đào tạo thêm về kỹ thuật mới.

      Kỹ năng của nhân viên cần được nâng cao.

      Nhân sự cần học thêm công nghệ.
    reason: Ba câu cùng ý về việc học thêm.
  good_examples:
  - mode: clean_rewrite
    text: Dự án cần thêm ngân sách để hoàn thành — cụ thể là khoảng 200 triệu cho giai đoạn hai.
    reason: Gộp ba câu thành một, thêm chi tiết cụ thể.
  - mode: no_change
    text: >-
      Dự án cần thêm ngân sách để hoàn thành.

      Đội ngũ cũng cần thêm hai kỹ sư.
    reason: Hai ý khác nhau, không echo.
  exceptions:
  - Điệp ngữ (anaphora) có chủ đích trong văn nghị luận hoặc thơ.
  - Văn bản nhiều phần cố ý nhắc lại ý chính.
  false_positive_risk: medium
  tags:
  - echo
  - lap-y
  - llm-judge
  min_occurrences: 1
- id: VI-HUM-D09
  name: phan-xa-tra-loi-tron-ven
  skill: humanizer-vi
  category: discourse
  finding_type: heuristic
  scope: document
  aggregation: single
  severity: low
  confidence: low
  summary: Nếu văn bản bắt đầu bằng câu hỏi hoặc nhiệm vụ, nó trả lời đầy đủ + giải thích + ví dụ + kết luận — không có chỗ nào lệch khỏi câu hỏi.
  signals:
    regex:
    - '(?!)'
  why_it_matters: >-
    Văn AI "hoàn thành nhiệm vụ" trọn vẹn: trả lời hết, giải thích đủ, cho ví dụ,
    kết luận rõ. Người viết tự nhiên có thể trả lời cụt, trả lời lệch, hoặc trả
    lời bằng câu hỏi khác.
  rewrite_strategy:
  - Cho phép văn bản dừng ở câu trả lời trực tiếp nếu không cần mở rộng.
  - Hoặc trả lời lệch nếu câu hỏi gợi ra hướng khác quan trọng hơn.
  bad_examples:
  - text: >-
      Câu hỏi: Tại sao dự án thất bại?

      Dự án thất bại vì ba lý do. Thứ nhất, thiếu ngân sách. Thứ hai, nhân sự yếu.
      Thứ ba, kế hoạch không rõ. Ví dụ, giai đoạn hai không có người phụ trách.
      Như vậy, có thể kết luận rằng thất bại là do nhiều yếu tố.
    reason: Trả lời đầy đủ + giải thích + ví dụ + kết luận, hoàn toàn trọn vẹn.
  - text: >-
      Làm thế nào để cải thiện quy trình?

      Có nhiều cách để cải thiện. Trước tiên, cần đánh giá hiện trạng. Tiếp theo,
      xác định điểm nghẽn. Sau đó, áp dụng cải tiến. Cuối cùng, đo lường kết quả.
    reason: Trả lời theo bốn bước, kết cấu hoàn hảo.
  good_examples:
  - mode: clean_rewrite
    text: Dự án thất bại vì thiếu ngân sách cho giai đoạn hai.
    reason: Trả lời trực tiếp, không mở rộng.
  - mode: no_change
    text: >-
      Làm thế nào để cải thiện quy trình?

      Câu hỏi hay. Nhưng trước khi trả lời, tôi cần biết quy trình hiện tại đang gặp vấn đề gì.
    reason: Không trả lời trực tiếp, hỏi ngược lại.
  exceptions:
  - Văn bản học thuật có yêu cầu trả lời đầy đủ theo rubric.
  - Hướng dẫn kỹ thuật có cấu trúc cố định.
  false_positive_risk: high
  tags:
  - qa-reflex
  - dien-ngon
  - llm-judge
  min_occurrences: 1
- id: VI-HUM-S14
  name: liet-ke-thu-tu-day-dac
  skill: humanizer-vi
  category: structural
  finding_type: heuristic
  scope: document
  aggregation: count
  severity: low
  confidence: medium
  summary: Dùng dày "thứ nhất/thứ hai/thứ ba" hoặc các biến thể liệt kê để chia ý, dấu hiệu listification của văn AI.
  signals:
    regex:
    - '(?!)'
  why_it_matters: >-
    Văn AI chia mọi ý thành "thứ nhất, thứ hai, thứ ba" để trông có cấu trúc.
    Người viết tự nhiên dùng marker khi cần thiết, có thể bỏ qua marker ở ý giữa,
    hoặc diễn đạt bằng từ nối đa dạng.
  rewrite_strategy:
  - Chỉ giữ marker khi thứ tự thật sự quan trọng.
  - Bỏ marker ở các ý có thể liệt kê tự nhiên.
  - Đa dạng hóa cách liên kết ý thay vì thuần "thứ nhất... thứ hai... thứ ba".
  bad_examples:
  - text: >-
      Dự án thất bại vì ba lý do. Thứ nhất, ngân sách không đủ. Thứ hai, đội ngũ thiếu người.
      Thứ ba, kế hoạch không rõ.
    reason: Ba markers "thứ nhất/hai/ba" liên tiếp.
  - text: >-
      Có ba điểm cần lưu ý. Thứ nhất là deadline. Thứ hai là ngân sách. Thứ ba là nhân sự.
    reason: Cấu trúc liệt kê đối xứng, mỗi mục gần bằng nhau.
  good_examples:
  - mode: clean_rewrite
    text: Dự án thất bại. Ngân sách không đủ, đội ngũ thiếu người, và kế hoạch không rõ.
    reason: Bỏ markers, giữ nguyên nội dung.
  - mode: no_change
    text: >-
      Có hai điểm cần lưu ý. Thứ nhất là deadline tháng 8 không thể dời. Thứ hai,
      ngân sách đã chốt từ tháng 6.
    reason: Chỉ 2 markers, dưới ngưỡng.
  exceptions:
  - Quy trình, luật, hướng dẫn kỹ thuật cần liệt kê theo thứ tự.
  - Đề bài yêu cầu rõ "liệt kê 3 điểm".
  false_positive_risk: medium
  tags:
  - liet-ke
  - cau-truc
  - heuristic
  min_occurrences: 3