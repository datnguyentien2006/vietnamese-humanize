- id: VI-TRA-S06
  name: lam-dung-cac-va-nhung
  skill: translationese-cleaner-vi
  category: lexical
  finding_type: preference
  scope: paragraph
  aggregation: count
  severity: low
  confidence: medium
  summary: Lạm dụng "các" và "những" trước danh từ số nhiều khi ngữ cảnh đã rõ.
  signals:
    regex:
    - '\bcác\b'
    - '\bnhững\b'
  why_it_matters: >-
    Mô hình viết tiếng Việt thêm "các" và "những" vào gần như mọi danh từ số nhiều
    để nghe "đầy đủ" hoặc "trang trọng". Người Việt viết tự nhiên thường lược bỏ
    khi ngữ cảnh đã rõ.
  rewrite_strategy:
  - Lược bỏ "các" hoặc "những" khi ngữ cảnh đã xác định số nhiều.
  - Giữ lại khi cần nhấn mạnh số lượng hoặc phân biệt với danh từ số ít.
  bad_examples:
  - text: >-
      Các giải pháp này sẽ giúp các doanh nghiệp nâng cao các chỉ số hiệu suất của
      các đội ngũ, đồng thời tạo ra những cơ hội mới cho những nhân viên có năng lực.
    reason: Năm lần "các"/"những" trong một câu.
  - text: >-
      Những cơ hội mới sẽ mở ra cho các nhân viên có năng lực trong các dự án sắp tới.
    reason: Ba lần "các"/"những" trong một câu ngắn.
  good_examples:
  - mode: clean_rewrite
    text: >-
      Giải pháp này giúp doanh nghiệp nâng cao chỉ số hiệu suất của đội ngũ, đồng thời
      tạo cơ hội mới cho nhân viên có năng lực.
    reason: Lược bỏ "các"/"những" thừa.
  - mode: clean_rewrite
    text: >-
      Cơ hội mới sẽ mở ra cho nhân viên có năng lực trong dự án sắp tới.
    reason: Lược bỏ "các"/"những" thừa.
  exceptions:
  - Cần phân biệt rõ số ít/số nhiều trong ngữ cảnh pháp lý.
  - Danh từ không đếm được.
  false_positive_risk: high
  tags:
  - cac-nhung
  - so-nhieu
  - translationese
  min_occurrences: 4
- id: VI-TRA-S07
  name: lam-dung-tro-tu-thoi-gian
  skill: translationese-cleaner-vi
  category: lexical
  finding_type: preference
  scope: paragraph
  aggregation: count
  severity: low
  confidence: medium
  summary: Lạm dụng "đã", "đang", "sẽ" khi ngữ cảnh thời gian đã rõ.
  signals:
    regex:
    - '\bđã\b'
    - '\bđang\b'
    - '\bsẽ\b'
  why_it_matters: >-
    Tiếng Việt tự nhiên lược bỏ các trợ từ thời gian khi ngữ cảnh đã rõ. Mô hình
    thêm chúng vào mọi câu vì tiếng Anh bắt buộc chia thì. Kết quả là văn bản nặng
    nề, lặp lại, không tự nhiên.
  rewrite_strategy:
  - Lược bỏ "đã"/"đang"/"sẽ" khi ngữ cảnh đã xác định thời gian.
  - Giữ lại khi cần nhấn mạnh sự tương phản thời gian.
  bad_examples:
  - text: >-
      Chúng tôi đã thực hiện việc cải tiến này và đang tiếp tục triển khai. Trong
      thời gian tới, chúng tôi sẽ sẽ mở rộng phạm vi và sẽ áp dụng cho toàn bộ hệ thống.
    reason: Bốn lần trợ từ thời gian trong hai câu.
  - text: >-
      Chúng tôi đã triển khai và sẽ tiếp tục mở rộng. Đội ngũ đang phối hợp và sẽ bàn giao
      vào tuần sau.
    reason: Nhiều trợ từ thời gian trong hai câu liền nhau.
  good_examples:
  - mode: clean_rewrite
    text: >-
      Chúng tôi cải tiến và triển khai. Thời gian tới, phạm vi mở rộng
      và áp dụng cho toàn bộ hệ thống.
    reason: Lược bỏ trợ từ thừa; ngữ cảnh đã rõ thời gian.
  - mode: clean_rewrite
    text: >-
      Chúng tôi đã triển khai và tiếp tục mở rộng. Đội ngũ phối hợp và bàn giao vào tuần sau.
    reason: Lược bỏ trợ từ thừa, giữ nguyên ý.
  exceptions:
  - Cần phân biệt rõ thời gian trong tường thuật.
  - Câu điều kiện.
  false_positive_risk: high
  tags:
  - tro-tu
  - thoi-gian
  - translationese
