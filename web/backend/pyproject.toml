[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vietnamese-writing-skills-web"
version = "0.4.6"
description = "Web API backend for Vietnamese Writing Skills"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "pydantic-settings>=2.3.0",
  "slowapi>=0.1.9",
  "sqlalchemy>=2.0.30",
  "psycopg2-binary>=2.9.9",
  "vietnamese-writing-skills==0.4.6",
  "groq>=0.9.0",
]

[tool.uv.sources]
vietnamese-writing-skills = { path = "../.." }

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/services/rewriter.py" = ["E501"]
