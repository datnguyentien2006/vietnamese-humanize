[build-system]
requires = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[project]
name = "vietnamese-writing-skills"
version = "0.5.0"
description = "Vietnamese writing linter (viet-writing-lint) and humanizer toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Vietnamese Writing Skills contributors" },
]
keywords = ["vietnamese", "writing", "style", "lint", "agent-skills"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Vietnamese",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "jsonschema>=4.22,<5",
  "pyyaml>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/datnguyentien2006/vietnamese-humanize"
Repository = "https://github.com/datnguyentien2006/vietnamese-humanize"
Issues = "https://github.com/datnguyentien2006/vietnamese-humanize/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.2",
  "ruff>=0.6",
  "twine>=5,<7",
]
llm = [
  "google-genai>=0.1.1",
]

[project.scripts]
viet-writing-lint = "vietnamese_writing_skills.cli.lint:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vietnamese_writing_skills"]

[tool.hatch.build.targets.wheel.force-include]
"patterns" = "vietnamese_writing_skills/data/patterns"
"skills" = "vietnamese_writing_skills/data/skills"

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "patterns/",
  "skills/",
  "tests/",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
